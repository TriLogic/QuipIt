[package]
name = "quipit"
version = "0.1.0"
edition = "2024"
description = "A simple desktop image editor for custom captioning"
license = "MIT"

[dependencies]
eframe = "0.33"
image = "0.25"
rfd = "0.15"
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
ab_glyph = "0.2"
epaint_default_fonts = "0.33"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
egui = { version = "0.33", features = ["serde"] }
tempfile = "3"
